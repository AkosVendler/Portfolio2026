    <script>
        (function () {
            try {
                if (sessionStorage.getItem('page-transition-active') === '1') {
                    document.documentElement.classList.add('is-transitioning');
                    document.body.style.visibility = 'hidden';
                    var el = document.getElementById('page-transition');
                    var color = sessionStorage.getItem('page-transition-color') || (localStorage.getItem('theme') === 'dark' ? '#0f0a0a' : '#ffffff');
                    if (!el) {
                        el = document.createElement('div'); el.id = 'page-transition';
                        el.style.position = 'fixed'; el.style.inset = '0'; el.style.zIndex = '999999';
                        el.style.background = color; el.style.transform = 'translateY(0%)';
                        document.documentElement.appendChild(el);
                    } else {
                        el.style.background = color; el.style.transform = 'translateY(0%)';
                    }
                }
            } catch (e) { }
        })();
    </script>
