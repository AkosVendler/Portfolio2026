<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendler Ákos</title>
    <link rel="stylesheet" href="./landing.css">
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./nav.css">
    <link rel="stylesheet" href="./services.css">
    <link rel="stylesheet" href="./footer.css">
    <link rel="stylesheet" href="./transition.css">
</head>

<body>

    <div id="loader"
        style="position:fixed;inset:0;background:#080808;z-index:9999;display:flex;align-items:center;justify-content:center;">
        <div style="position:relative;width:100vw;height:100vh;">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div id="page-transition"></div>

    <nav>
        <button id="theme-toggle" onclick="playSound('click')" data-i18n="dark-mode"></button>
        <button id="menu-open" onclick="playSound('click')" data-i18n="menu"></button>
        <a href="./contact.html" onclick="playSound('click')" data-i18n="contact"></a>
    </nav>

    <!-- Fullscreen nav -->
    <div id="main-nav" class="hero-reveal">
        <div class="nav-lang">
            <button class="lang-btn" onclick="playSound('click')" data-lang="hu">HU</button>
            <button class="lang-btn" onclick="playSound('click')" data-lang="en">EN</button>
        </div>

        <ul class="nav-links">
            <li><a href="./index.html" onclick="playSound('click')" data-i18n="nav-home" class="nav-link">Home</a></li>
            <li><a href="./about.html" onclick="playSound('click')" data-i18n="nav-about" class="nav-link">About</a></li>
            <li><a href="./work.html" onclick="playSound('click')" data-i18n="nav-work" class="nav-link">Work</a></li>
            <li><a href="./contact.html" onclick="playSound('click')" data-i18n="nav-contact" class="nav-link">Contact</a></li>
        </ul>

        <button class="nav-close" onclick="playSound('click')" data-i18n="nav-close">Bezárás</button>
    </div>

    <div class="hero">
        <h1 id="hero-name" data-i18n="title" class="title"></h1>
        <div class="hero-content hero-reveal">
            <div class="video-wrapper">
                <video autoplay muted loop playsinline webkit-playsinline>
                    <source src="./media/demoshowreel.mp4" type="video/mp4" />
                </video>
            </div>
            <div class="hero-title hero-reveal">
                <h2 data-i18n="hero-title-1"></h2>
                <h2 data-i18n="hero-title-2"></h2>
            </div>
        </div>
        <div class="timezones hero-reveal">
            <div class="timezone">
                <p>Budapest</p>
                <p id="budapest-time"></p>
            </div>
            <div class="location">
                <p>Miskolc, </p>
                <p data-i18n="country"></p>
            </div>
        </div>
    </div>

    <div class="featured-works">
        <div class="featured-title">
            <h1 data-i18n="featured-works"></h1>
        </div>
        <div class="works-grid">
            <div class="work-item">
                <img src="./media/work1.png" alt="Work 1">
                <h3>Project One</h3>
            </div>
            <div class="work-item">
                <img src="./media/work2.png" alt="Work 2">
                <h3>Project Two</h3>
            </div>
        </div>
    </div>

    <div class="services">
        <h1 class="page-title" data-i18n="services-title"></h1>
        <div id="physics-section">
            <div class="hint-text" data-i18n="services-hint"></div>
        </div>
    </div>

    <footer>
        <div class="image-container">
            <img src="./media/cat-crazy-cat.gif">
            <h1 data-i18n="footer-question"></h1>
        </div>

        <div class="contact-section">
            <p data-i18n="footer-text"></p>
            <a href="mailto:vendler.akos@gmail.com">vendler.akos@gmail.com</a>
        </div>

        <div class="footer-content">
            <div class="link-wrapper">
                <a href="https://instagram.com/_vndlrakos_" target="_blank">Instagram</a>
                <a href="https://www.behance.net/akosvendler" target="_blank">Behance</a>
                <a href="https://www.linkedin.com/in/%C3%A1kos-vendler-3a2a883b2/" target="_blank">Linkedin</a>
            </div>

            <p class="copyright">© 2026 - vendler ákos</p>
        </div>

    </footer>

</body>


<script>
   function startClock() { const el = document.getElementById("budapest-time"); if (!el) return; const tick = () => { el.textContent = new Date().toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Europe/Budapest", }); }; tick(); setInterval(tick, 1000); } startClock();
</script>


<script src="https://unpkg.com/split-type"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/themeselector.js"></script>
<script type="module" src="./js/videoScroll.js"></script>
<script type="module" src="./js/lenis.js"></script>
<script type="module" src="./js/servicesSection.js"></script>
<script type="module" src="./js/introAnimation.js"></script>
<script src="./js/clickSound.js"></script>
<script type="module" src="./js/pageTransition.js"></script>


</html>
